<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>taskflow</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <nav>
        <h1 class="brand">Taskflow</h1>
        <button id="themebtn">🌞</button>
    </nav><br>
    <main>
        <div id="navigationLinks">
            <button id="homebtn" class="nav-btn">home</button>
            <button id="dashboard" class="nav-btn">Dashboard</button>
            <button id="projects" class="nav-btn">projects</button>
            <button id="analytics" class="nav-btn">Analytics</button>
            
        </div><br>
        <hr><br>
        <h2 id="username"></h2>
        <div id="content">

            <div id="createtask">
               
                <div class="hero">
                    <h3>create task</h3><br>
                <form class="worklist">
                    <input type="text" id="task" name="task" placeholder="Add your task">
                    <br>
                    <p>Select Priority:</p>
                    <label id="option" >
                        <input type="radio" name="priority" value="high"> High 
                    
                        <input type="radio" name="priority" value="medium"> Medium
                    
                        <input type="radio" name="priority" value="low"> Low
                    </label>

                    <button type="submit" id="createbtn"><b>Create</b></button>
                </form>

                <br>
                <div class="recenttask">
                <p><u>recent-task:</u></p>
                <br>
                <ul>    
                </ul>
            </div>
        </div>

            </div>
        </div>
        <div id="currentprogress">
            
            
        </div>
    </main>
    <script type="module" src="/JS/app.js"></script>
<script type="module" src="/JS/tasks.js"></script>

</body>
</html>

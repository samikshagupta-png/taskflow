<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboardpage</title>
    <link rel="stylesheet" href="/CSS/dashboard.css">
</head>
<body>
    
        
        <div class="mainbox">
            <div class="status">
                <div id="totaltask">Total-tasks:0</div>
                <div id="completed">completed-task:0</div>
                <div id="pending">pending-tasks:0</div>
            </div>
            <div id =recenttasksection>
                <h2>Recent-tasks:</h2>
                
            </div>
        </div><br>
        <form class="searchlist">
                    <input type="text" id="searchtask" name="task" placeholder="search task">
                    <div class="prioritydiv"><label for="priority">Priority:</label>
                        <select id="taskpriority" name="priority">
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                        </select></div>
                        
                        <!-- <div class="statusdiv"><label for="status">Status:</label>
                        <select id="status" name="status">
                        <option value="completed">completed</option>
                        <option value="pending">pending</option>
                        <option value="overdue">overdue</option>
                        </select></div> -->
                    <button type="submit" id="searchbtn"><b>search</b></button>
        </form>
        <div class="searchlists"></div>
        <script src="/JS/tasks.js"></script>
    
</body>
</html>
